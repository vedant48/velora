appId: com.vedant.velora
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Log in / Sign up"
    timeout: 20000
- tapOn: "Movies"
- waitForAnimationToEnd:
    timeout: 6000
- tapOn: "Details"
- waitForAnimationToEnd:
    timeout: 9000
- takeScreenshot: m1-movie-details
- scroll
- scroll
- takeScreenshot: m2-movie-details-scrolled
- back
- tapOn: "Series"
- waitForAnimationToEnd:
    timeout: 6000
- tapOn: "Details"
- waitForAnimationToEnd:
    timeout: 9000
- takeScreenshot: m3-series-details
- scroll
- scroll
- takeScreenshot: m4-series-details-scrolled
- back
- tapOn:
    point: "70%,96%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: m5-explore-or-tab4
