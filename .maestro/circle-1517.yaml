appId: com.vedant.velora
---
- runFlow: login-design2.yaml
- assertVisible: 'Member since.*'
- takeScreenshot: ${P}-c0-profile-want-badges
- tapOn: F1
- extendedWaitUntil:
    visible: 'Loud, fast.*'
    timeout: 30000
- assertNotVisible: 'Write a review.*'
- takeScreenshot: ${P}-c1-movie-top
- swipe:
    start: 50%, 70%
    end: 50%, 40%
    duration: 500
- takeScreenshot: ${P}-c2-movie-scrolled
- back
- tapOn:
    point: 53%, 34%
- scrollUntilVisible:
    element: 'Breaking Bad'
    timeout: 20000
- tapOn: 'Breaking Bad'
- extendedWaitUntil:
    visible: 'Season four, the cat.*'
    timeout: 30000
- assertNotVisible: 'Write a review.*'
- takeScreenshot: ${P}-c3-series-top
- swipe:
    start: 85%, 60%
    end: 15%, 60%
    duration: 400
- takeScreenshot: ${P}-c4-series-cards-scrolled
- swipe:
    start: 50%, 75%
    end: 50%, 35%
    duration: 500
- takeScreenshot: ${P}-c5-series-scrolled
- swipe:
    start: 50%, 30%
    end: 50%, 90%
    duration: 400
- swipe:
    start: 50%, 30%
    end: 50%, 90%
    duration: 400
- tapOn: 'E2E Alice ratings'
- extendedWaitUntil:
    visible: 'Season 2'
    timeout: 15000
- takeScreenshot: ${P}-c6-drawer-alice
- back
- tapOn: 'E2E Bob ratings'
- extendedWaitUntil:
    visible: 'Season 4'
    timeout: 15000
- takeScreenshot: ${P}-c7-drawer-bob
