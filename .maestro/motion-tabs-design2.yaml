appId: com.vedant.velora
---
# Design native-header motion: tab switches and flings on the redesign library
# (grouped Series list + Insights), with per-tab offset preservation.
- launchApp
# Wait for a settled state first (session restore can briefly show the logged-out
# screen): either the profile is back or the login CTA is really there.
- extendedWaitUntil:
    visible: "E2E Alice|Log in / Sign up"
    timeout: 30000
- runFlow:
    when:
      visible: 'Log in / Sign up'
    file: login-design2.yaml
- extendedWaitUntil:
    visible: E2E Alice
    timeout: 30000
- takeScreenshot: m0-top
- swipe: { direction: UP, duration: 300 }
- swipe: { direction: UP, duration: 300 }
- swipe: { direction: UP, duration: 300 }
- takeScreenshot: m1-want-deep
- tapOn:
    id: library-tab-series
- extendedWaitUntil:
    visible: Prison Break
    timeout: 60000
- swipe: { direction: UP, duration: 400 }
- takeScreenshot: m2-series-scrolled
- tapOn:
    id: library-tab-insights
- extendedWaitUntil:
    visible: Average rating
    timeout: 30000
- swipe: { direction: UP, duration: 300 }
- takeScreenshot: m3-insights-scrolled
- tapOn:
    id: library-tab-want
- takeScreenshot: m4-want-return
- swipe: { direction: DOWN, duration: 400 }
- swipe: { direction: DOWN, duration: 400 }
- swipe: { direction: DOWN, duration: 400 }
- extendedWaitUntil:
    visible: E2E Alice
    timeout: 10000
- takeScreenshot: m5-top-restored
