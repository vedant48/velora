appId: com.vedant.velora
---
- launchApp
- tapOn: 'Log in / Sign up'
- tapOn: Username
- inputText: e2e_alice
- tapOn: Password
- inputText: e2e-alice-pass-1
- hideKeyboard
- tapOn:
    text: 'Log in'
    below: Password
- extendedWaitUntil:
    visible: E2E Alice
    timeout: 20000
# Want tab: the Want series is listed here with the Want movies.
- assertVisible: Pulp Fiction
- assertVisible: The Last Kingdom
- takeScreenshot: 1-want-tab-has-want-series
- swipe:
    start: 85%, 65%
    end: 20%, 65%
    duration: 1200
- assertVisible: Inception
- takeScreenshot: 2-watched-tab
- swipe:
    start: 85%, 65%
    end: 20%, 65%
    duration: 1200
# Series tab: tracked series only, the Want series is not here.
- assertVisible: Breaking Bad
- assertNotVisible: The Last Kingdom
- takeScreenshot: 3-series-tab-no-want-series
- tapOn:
    point: 13%, 40%
- scrollUntilVisible:
    element: The Last Kingdom
    direction: DOWN
    timeout: 20000
- takeScreenshot: 3b-want-tab-scrolled-last-kingdom
- tapOn: The Last Kingdom
# Title opened from the library: TMDB score comes from the loaded details.
- extendedWaitUntil:
    visible: TMDB
    timeout: 40000
- takeScreenshot: 4-detail-tmdb-score
