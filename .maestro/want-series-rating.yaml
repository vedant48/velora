appId: com.vedant.velora
---
- launchApp
- tapOn: 'Log in / Sign up'
- tapOn: Username
- inputText: e2e_alice
- tapOn: Password
- inputText: e2e-alice-pass-1
- hideKeyboard
- tapOn:
    text: 'Log in'
    below: Password
- extendedWaitUntil:
    visible: E2E Alice
    timeout: 20000
# Fixture: the only Want title is the Want series, so it is the first visible poster.
- takeScreenshot: 3b-want-tab-scrolled-last-kingdom
- tapOn:
    point: 25%, 65%
- extendedWaitUntil:
    visible: TMDB
    timeout: 40000
- takeScreenshot: 4-detail-tmdb-score
