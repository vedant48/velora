# Flow B: sign out, sign in as the second synthetic user, view the first
# user's photo as another member, then switch back - proving member
# visibility and that avatar loads never use a stale session token.
appId: com.vedant.velora
---
- launchApp
- tapOn: "Profile"
- tapOn: "More profile actions"
- tapOn: "Log out"
- tapOn:
    text: "Log out"
    index: 1
- assertVisible:
    text: "Log in / Sign up"
    timeout: 10000
- tapOn: "Log in / Sign up"
- tapOn: "Username"
- inputText: "e2e_bob"
- tapOn: "Password"
- inputText: "e2e-bob-pass-1"
- hideKeyboard
- tapOn: "Log in"
- assertVisible:
    text: "E2E Bob"
    timeout: 20000
- tapOn: "Search"
- tapOn: "People"
- tapOn: "Search movies, TV shows, actors..."
- inputText: "e2e_alice"
- assertVisible:
    text: "E2E Alice"
    timeout: 15000
- tapOn: "E2E Alice"
- assertVisible:
    text: "@e2e_alice"
    timeout: 10000
- takeScreenshot: b1-member-view-photo
- tapOn: "Back"
- tapOn: "Profile"
- tapOn: "More profile actions"
- tapOn: "Log out"
- tapOn:
    text: "Log out"
    index: 1
- tapOn: "Log in / Sign up"
- tapOn: "Username"
- inputText: "e2e_alice"
- tapOn: "Password"
- inputText: "e2e-alice-pass-1"
- hideKeyboard
- tapOn: "Log in"
- assertVisible:
    text: "E2E Alice"
    timeout: 20000
- takeScreenshot: b2-relogin-photo
