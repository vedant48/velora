appId: com.vedant.velora
---
- runFlow: login-design2.yaml
# Focused persistence proof (main 14:28): mark -> list aggregate -> non-destructive
# APP RELAUNCH (killApp + launchApp, no clearState, no reseed) -> same-account readback.
# Navigation reopen alone is NOT accepted as persistence evidence.
- assertVisible:
    id: library-tab-series
- tapOn: 'Prison Break'
- extendedWaitUntil:
    visible: '22 of 22 episodes'
    timeout: 60000
- tapOn:
    id: season-menu
- tapOn: 'Resurrection'
- extendedWaitUntil:
    visible: '0 of 9 episodes'
    timeout: 30000
- swipe:
    from:
      text: 'Ogygia'
    direction: RIGHT
    duration: 600
- extendedWaitUntil:
    visible: '1 of 9 episodes'
    timeout: 20000
- takeScreenshot: p1-marked
- back
- extendedWaitUntil:
    visible: '.*41 of 88 episodes'
    timeout: 30000
- takeScreenshot: p2-list-aggregate
- killApp
- launchApp
- extendedWaitUntil:
    visible:
      id: library-tab-series
    timeout: 60000
- extendedWaitUntil:
    visible: '.*41 of 88 episodes'
    timeout: 30000
- takeScreenshot: p3-relaunch-list
- tapOn: 'Prison Break'
- extendedWaitUntil:
    visible: '22 of 22 episodes'
    timeout: 60000
- tapOn:
    id: season-menu
- tapOn: 'Resurrection'
- extendedWaitUntil:
    visible: '1 of 9 episodes'
    timeout: 30000
- takeScreenshot: p4-relaunch-details
