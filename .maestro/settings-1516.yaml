appId: com.vedant.velora
---
- runFlow: login-design2.yaml
- assertVisible: 'Member since.*'
- takeScreenshot: p0-home-one-icon
- swipe:
    start: 50%, 70%
    end: 50%, 45%
    duration: 800
- takeScreenshot: p1-home-partial-collapse
- swipe:
    start: 50%, 85%
    end: 50%, 15%
    duration: 400
- takeScreenshot: p2-home-collapsed
- tapOn: Series
- takeScreenshot: p3-series-after-collapse
- tapOn: Want
- swipe:
    start: 50%, 25%
    end: 50%, 90%
    duration: 300
- swipe:
    start: 50%, 25%
    end: 50%, 90%
    duration: 300
- swipe:
    start: 50%, 25%
    end: 50%, 90%
    duration: 300
- swipe:
    start: 50%, 25%
    end: 50%, 90%
    duration: 300
- takeScreenshot: p5-expanded
- tapOn:
    point: 90%, 5%
- assertVisible: 'Appearance'
- takeScreenshot: s1-settings-top
- swipe:
    start: 50%, 80%
    end: 50%, 55%
    duration: 800
- takeScreenshot: s2-settings-partial-scroll
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 500
- takeScreenshot: s3-settings-bottom
- scrollUntilVisible:
    element: Appearance
    direction: UP
    timeout: 20000
- tapOn: Appearance
- takeScreenshot: s4-appearance-sheet
- tapOn: Cancel
- scrollUntilVisible:
    element: Export your data
    direction: DOWN
    timeout: 20000
- tapOn: Export your data
- takeScreenshot: s4b-export-sheet
- tapOn: Cancel
- scrollUntilVisible:
    element: 'About & Credits'
    direction: DOWN
    timeout: 20000
- tapOn: 'About & Credits'
- assertVisible: 'This product uses the TMDB API.*'
- takeScreenshot: s5-about
- back
- scrollUntilVisible:
    element: Activity
    direction: UP
    timeout: 20000
- tapOn: Activity
- takeScreenshot: s6-activity-opens
- back
- scrollUntilVisible:
    element: 'Edit profile'
    direction: UP
    timeout: 20000
- tapOn: 'Edit profile'
- assertVisible: 'Save profile'
- takeScreenshot: s7-edit-profile
- swipe:
    start: 50%, 80%
    end: 50%, 50%
    duration: 600
- takeScreenshot: s7b-edit-profile-scrolled
- back
- assertVisible: 'Appearance'
- back
- assertVisible: 'Member since.*'
- takeScreenshot: s8-back-home
