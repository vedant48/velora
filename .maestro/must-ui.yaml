appId: com.vedant.velora
---
- launchApp
- tapOn: 'Log in / Sign up'
- tapOn: Username
- inputText: e2e_alice
- tapOn: Password
- inputText: e2e-alice-pass-1
- hideKeyboard
- tapOn:
    text: 'Log in'
    below: Password
- extendedWaitUntil:
    visible: E2E Alice
    timeout: 20000
- takeScreenshot: home-dark
# Short horizontal drag cancels and stays on Want.
- swipe:
    start: 65%, 67%
    end: 59%, 67%
    duration: 800
- assertVisible: Pulp Fiction
- takeScreenshot: cancelled-drag
- swipe:
    start: 85%, 65%
    end: 20%, 65%
    duration: 1200
- assertVisible: Inception
- takeScreenshot: swipe-watched
- swipe:
    start: 85%, 65%
    end: 20%, 65%
    duration: 1200
- assertVisible: Breaking Bad
- takeScreenshot: swipe-series
- swipe:
    start: 85%, 65%
    end: 20%, 65%
    duration: 1200
- assertVisible: Average rating
- scrollUntilVisible:
    element: Rating distribution
    direction: DOWN
    timeout: 15000
- swipe:
    start: 50%, 72%
    end: 50%, 48%
    duration: 500
- takeScreenshot: swipe-insights
- swipe:
    start: 20%, 65%
    end: 85%, 65%
    duration: 1200
- assertVisible: Breaking Bad
- takeScreenshot: reverse-series
- tapOn:
    id: library-tab-watched
- assertVisible: Inception
- tapOn:
    id: library-tab-want
- assertVisible: Pulp Fiction
- tapOn: Filter and sort
- takeScreenshot: filter-open
- tapOn: Apply filters
- takeScreenshot: filter-closed
- tapOn:
    id: library-tab-want
- swipe:
    start: 50%, 50%
    end: 50%, 85%
    duration: 1600
- takeScreenshot: pull-refresh
- assertVisible: Want
- assertVisible: E2E Alice
- tapOn: Explore Movies
- extendedWaitUntil:
    visible: Movies
    timeout: 15000
- scrollUntilVisible:
    element: Coming Soon
    direction: DOWN
    timeout: 45000
- extendedWaitUntil:
    notVisible: Loading
    timeout: 45000
- takeScreenshot: movies-lower
- swipe:
    direction: DOWN
    duration: 1200
- takeScreenshot: explore-movies
- tapOn: Explore TV Series
- assertVisible: TV Shows
- swipe:
    start: 50%, 78%
    end: 50%, 32%
    duration: 600
- extendedWaitUntil:
    visible: Sci-Fi & Fantasy TV
    timeout: 45000
- takeScreenshot: explore-tv
- tapOn: Sci-Fi & Fantasy TV
- takeScreenshot: tv-collection
- back
- tapOn: Explore All
- assertVisible: Explore All
- takeScreenshot: explore-all
- tapOn: Search
- assertVisible: Search movies, TV shows, actors...
- takeScreenshot: search
- tapOn: Back to library
- tapOn: Settings
- tapOn: Light theme
- tapOn: Back
- takeScreenshot: home-light
- stopApp
- launchApp
- extendedWaitUntil:
    visible: E2E Alice
    timeout: 15000
- takeScreenshot: cold-start-home
