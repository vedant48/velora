appId: com.vedant.velora
---
- launchApp
- extendedWaitUntil:
    visible: 'Home'
    timeout: 20000
- takeScreenshot: ${P}-k1-launch
- tapOn: Series
- takeScreenshot: ${P}-k2-series
- tapOn: Home
- tapOn:
    point: 90%, 5%
- scrollUntilVisible:
    element: Activity
    timeout: 15000
- tapOn: Activity
- takeScreenshot: ${P}-k3-activity
- back
- back
- tapOn: Want
- tapOn: F1
- takeScreenshot: ${P}-k4-details
