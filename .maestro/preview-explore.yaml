appId: com.vedant.velora
---
# Preview evidence for the unified Explore + skeleton/session-restore fixes.
# Runs against the local wrangler backend behind the delay proxy (1.4s reads),
# so loading states stay on screen long enough to capture.
# Asserts are the regression gates; screenshots carry the visual evidence.

# 1. Signed-out cold start: the login wall is correct here (no session).
- launchApp
- extendedWaitUntil:
    visible:
      text: "Log in / Sign up"
    timeout: 20000
- takeScreenshot: p01-signedout-home-wall

# 2. Log in as the seeded member.
- tapOn: "Log in / Sign up"
- tapOn: "Username"
- inputText: "e2e_alice"
- tapOn: "Password"
- inputText: "e2e-alice-pass-1"
- hideKeyboard
- tapOn:
    text: "Sign in"
    below: "Password"
- extendedWaitUntil:
    visible:
      text: "E2E Alice"
    timeout: 30000
- takeScreenshot: p02-home-loaded

# 3. Cold start with a saved session: the login wall must never appear while
#    the token validates (delayed 1.4s by the proxy, so a regression would be caught).
- stopApp
- launchApp
- assertNotVisible: "Log in / Sign up"
- takeScreenshot: p03-coldstart-restoring
- extendedWaitUntil:
    visible:
      text: "E2E Alice"
    timeout: 30000
- assertNotVisible: "Log in / Sign up"
- takeScreenshot: p04-home-restored
- tapOn:
    id: "library-tab-watched"
- waitForAnimationToEnd
- takeScreenshot: p04b-watched-poster-grid
- tapOn:
    id: "library-tab-want"
- waitForAnimationToEnd
- takeScreenshot: p04c-want-poster-grid

# 4. Unified Explore: Movies/Series filter chips, personal rails, genre browse.
#    Default view is Movies (owner removed the All filter).
- tapOn: "Explore"
- extendedWaitUntil:
    visible:
      text: "For you"
    timeout: 60000
- takeScreenshot: p05-explore-movies-top
- assertVisible: "Movies"
- assertVisible: "Series"
# Rails mount only near the viewport (LazySection), so anything below the
# first screen must be scrolled into view, not bare-asserted.
# Order check (owner 28 Nov): Trending movies right after For you, the
# Because-you-liked rail only after the Trending rails.
- scrollUntilVisible:
    element:
      text: "Trending movies"
    direction: DOWN
- takeScreenshot: p05b-trending-after-foryou
- assertNotVisible: "Watch next"
- scrollUntilVisible:
    element:
      text: "Because you liked Fight Club"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Science Fiction"
    direction: DOWN
- takeScreenshot: p06-explore-genres-movies
- scrollUntilVisible:
    element:
      text: "Available for streaming"
    direction: DOWN
- takeScreenshot: p07-explore-movies-catalog
- scrollUntilVisible:
    element:
      text: "In Theaters Now"
    direction: DOWN
- takeScreenshot: p07b-in-theaters
- scrollUntilVisible:
    element:
      text: "Coming Soon"
    direction: DOWN
- takeScreenshot: p07c-coming-soon
- scrollUntilVisible:
    element:
      id: "explore-filter-tv"
    direction: UP
- tapOn:
    id: "explore-filter-tv"
- scrollUntilVisible:
    element:
      text: "Trending series"
    direction: DOWN
    timeout: 60000
- takeScreenshot: p08-explore-series
- scrollUntilVisible:
    element:
      text: "Watch next"
    direction: DOWN
- takeScreenshot: p08b-explore-watch-next
- scrollUntilVisible:
    element:
      text: "War & Politics"
    direction: DOWN
- takeScreenshot: p09-explore-genres-series

# 4b. Genre browse page (genre tap): loading skeleton must be 3 poster-only
#     columns matching the loaded grid - no text bars (member report 28 Nov).
- scrollUntilVisible:
    element:
      text: "Comedy series"
    direction: UP
- tapOn: "Comedy series"
# Deterministic skeleton window: the e2e build routes TMDB through the delay
# proxy (1.5s on discover reads) and Comedy is a genre the flow has not opened
# before, so no cache can skip the skeleton. Capture immediately (the
# accessibilityLabel "Loading" is not reliably matchable by maestro, so do not
# wait on it - same pattern as the search-skeleton capture).
- takeScreenshot: p09b-genre-browse-loading
# First rating chip (e.g. "7.4") means the grid has loaded.
- extendedWaitUntil:
    visible:
      text: "^\\d+\\.\\d$"
    timeout: 60000
# Movies/TV switch removed from the genre page (member request 28 Nov)
- assertNotVisible:
    text: "Movies"
- takeScreenshot: p09c-genre-browse-loaded
- tapOn: "Go back"

# 5. Search skeleton then results, same query as the member's report.
- tapOn: "Search"
- tapOn: "Movies, series, people…"
- inputText: "ramayan"
- takeScreenshot: p10-search-loading
- extendedWaitUntil:
    visible:
      text: "(?i).*ramayan.*"
    timeout: 60000
- takeScreenshot: p11-search-results

# 6. Genre drawer from a movie Details page: drawer lists movies only.
- tapOn: "Clear search"
- tapOn: "Movies, series, people…"
- inputText: "fight club"
- extendedWaitUntil:
    visible:
      text: "1999"
    timeout: 60000
- tapOn:
    containsChild:
      text: "Fight Club"
- extendedWaitUntil:
    visible:
      text: "My rating 9 of 10"
    timeout: 60000
- assertNotVisible:
    text: "Share Fight Club"
- assertVisible:
    text: "Drama genre"
- takeScreenshot: p11b-details-fightclub
- extendedWaitUntil:
    visible:
      text: "Drama genre"
    timeout: 90000
- tapOn: "Drama genre"
- assertVisible:
    id: "genre-sheet-movie"
- takeScreenshot: p12-genre-drawer-movie
- tapOn: "Dismiss"
- assertNotVisible:
    id: "genre-sheet-movie"
- tapOn: "Go back"

# 7. Genre drawer from a series Details page: drawer lists series only.
- tapOn: "Clear search"
- tapOn: "Movies, series, people…"
- inputText: "game of thrones"
- extendedWaitUntil:
    visible:
      text: "2011"
    timeout: 60000
- tapOn:
    containsChild:
      text: "Game of Thrones"
- extendedWaitUntil:
    visible:
      text: "Drama genre"
    timeout: 90000
- assertNotVisible:
    text: "Share Game of Thrones"
- takeScreenshot: p13b-details-got
- tapOn: "Drama genre"
- assertVisible:
    id: "genre-sheet-tv"
- takeScreenshot: p13-genre-drawer-series
- tapOn: "Dismiss"
- assertNotVisible:
    id: "genre-sheet-tv"
- tapOn: "Go back"

# 8. Light theme over the restored Home, then back to dark. Search hides the
# tab bar, so "Home" would hit the Android system home button; leave Search
# through its own back arrow instead.
- tapOn: "Back to library"
- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      text: "Appearance"
    timeout: 20000
- tapOn: "Appearance"
- tapOn: "Light"
- tapOn: "Back"
- takeScreenshot: p14-home-light
- tapOn: "Settings"
- tapOn: "Appearance"
- tapOn: "Dark"
- tapOn: "Back"
- takeScreenshot: p15-home-dark

# 9. Dark theme over Explore, genres and the genre drawer.
- tapOn: "Explore"
# Explore keeps its previous scroll position; the For you rail is above the
# viewport (and unmounted) unless we scroll back up first.
- scrollUntilVisible:
    element:
      text: "For you"
    direction: UP
    timeout: 30000
- takeScreenshot: p16-explore-dark-top
- scrollUntilVisible:
    element:
      text: "Browse by genre"
    direction: DOWN
- takeScreenshot: p17-explore-dark-genres
- tapOn: "Search"
# The Search tab keeps the previous query; clear it if present so the
# placeholder exists for the next tap.
- tapOn:
    text: "Clear search"
    optional: true
- tapOn: "Movies, series, people…"
- inputText: "fight club"
- extendedWaitUntil:
    visible:
      text: "1999"
    timeout: 60000
- tapOn:
    containsChild:
      text: "Fight Club"
- extendedWaitUntil:
    visible:
      text: "My rating 9 of 10"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "Drama genre"
    timeout: 90000
- tapOn: "Drama genre"
- assertVisible:
    id: "genre-sheet-movie"
- takeScreenshot: p18-dark-genre-drawer
- tapOn: "Dismiss"
- assertNotVisible:
    id: "genre-sheet-movie"
