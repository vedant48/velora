appId: com.vedant.velora
---
# Preview evidence for the unified Explore + skeleton/session-restore fixes.
# Runs against the local wrangler backend behind the delay proxy (1.4s reads),
# so loading states stay on screen long enough to capture.
# Asserts are the regression gates; screenshots carry the visual evidence.

# 1. Signed-out cold start: the login wall is correct here (no session).
- launchApp
- extendedWaitUntil:
    visible:
      text: "Log in / Sign up"
    timeout: 20000
- takeScreenshot: p01-signedout-home-wall

# 2. Log in as the seeded member.
- tapOn: "Log in / Sign up"
- tapOn: "Username"
- inputText: "e2e_alice"
- tapOn: "Password"
- inputText: "e2e-alice-pass-1"
- hideKeyboard
- tapOn:
    text: "Sign in"
    below: "Password"
- extendedWaitUntil:
    visible:
      text: "E2E Alice"
    timeout: 30000
- takeScreenshot: p02-home-loaded

# 3. Cold start with a saved session: the login wall must never appear while
#    the token validates (delayed 1.4s by the proxy, so a regression would be caught).
- stopApp
- launchApp
- assertNotVisible: "Log in / Sign up"
- takeScreenshot: p03-coldstart-restoring
- extendedWaitUntil:
    visible:
      text: "E2E Alice"
    timeout: 30000
- assertNotVisible: "Log in / Sign up"
- takeScreenshot: p04-home-restored
- tapOn:
    id: "library-tab-watched"
- waitForAnimationToEnd
- takeScreenshot: p04b-watched-poster-grid
- tapOn:
    id: "library-tab-want"
- waitForAnimationToEnd
- takeScreenshot: p04c-want-poster-grid

# 4. Unified Explore: Movies/Series filter chips, personal rails, genre browse.
#    Default view is Movies (owner removed the All filter).
- tapOn: "Explore"
- extendedWaitUntil:
    visible:
      text: "For you"
    timeout: 60000
- takeScreenshot: p05-explore-movies-top
- assertVisible: "Movies"
- assertVisible: "Series"
- assertVisible: "Because you liked Fight Club"
# Rails mount only near the viewport (LazySection), so anything below the
# first screen must be scrolled into view, not bare-asserted.
- scrollUntilVisible:
    element:
      text: "Trending movies"
    direction: DOWN
- assertNotVisible: "Watch next"
- scrollUntilVisible:
    element:
      text: "Science Fiction"
    direction: DOWN
- takeScreenshot: p06-explore-genres-movies
- scrollUntilVisible:
    element:
      text: "Available for streaming"
    direction: DOWN
- takeScreenshot: p07-explore-movies-catalog
- scrollUntilVisible:
    element:
      id: "explore-filter-tv"
    direction: UP
- tapOn:
    id: "explore-filter-tv"
- scrollUntilVisible:
    element:
      text: "Trending series"
    direction: DOWN
    timeout: 60000
- takeScreenshot: p08-explore-series
- scrollUntilVisible:
    element:
      text: "Watch next"
    direction: DOWN
- takeScreenshot: p08b-explore-watch-next
- scrollUntilVisible:
    element:
      text: "War & Politics"
    direction: DOWN
- takeScreenshot: p09-explore-genres-series

# 5. Search skeleton then results, same query as the member's report.
- tapOn: "Search"
- tapOn: "Movies, series, people…"
- inputText: "ramayan"
- takeScreenshot: p10-search-loading
- extendedWaitUntil:
    visible:
      text: "(?i).*ramayan.*"
    timeout: 60000
- takeScreenshot: p11-search-results

# 6. Genre drawer from a movie Details page: drawer lists movies only.
- tapOn: "Clear search"
- tapOn: "Movies, series, people…"
- inputText: "fight club"
- extendedWaitUntil:
    visible:
      text: "Fight Club"
    timeout: 60000
- tapOn: "Fight Club"
- extendedWaitUntil:
    visible:
      text: "Share Fight Club"
    timeout: 60000
- takeScreenshot: p11b-details-fightclub
- extendedWaitUntil:
    visible:
      text: "Drama"
    timeout: 90000
- tapOn: "Drama"
- assertVisible:
    id: "genre-sheet-movie"
- takeScreenshot: p12-genre-drawer-movie
- tapOn: "Dismiss"
- assertNotVisible:
    id: "genre-sheet-movie"
- tapOn: "Go back"

# 7. Genre drawer from a series Details page: drawer lists series only.
- tapOn: "Clear search"
- tapOn: "Movies, series, people…"
- inputText: "game of thrones"
- extendedWaitUntil:
    visible:
      text: "Game of Thrones"
    timeout: 60000
- tapOn: "Game of Thrones"
- extendedWaitUntil:
    visible:
      text: "Share Game of Thrones"
    timeout: 60000
- takeScreenshot: p13b-details-got
- extendedWaitUntil:
    visible:
      text: "Drama"
    timeout: 90000
- tapOn: "Drama"
- assertVisible:
    id: "genre-sheet-tv"
- takeScreenshot: p13-genre-drawer-series
- tapOn: "Dismiss"
- assertNotVisible:
    id: "genre-sheet-tv"
- tapOn: "Go back"

# 8. Light theme over the restored Home, then back to dark.
- tapOn: "Home"
- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      text: "Appearance"
    timeout: 20000
- tapOn: "Appearance"
- tapOn: "Light"
- tapOn: "Back"
- takeScreenshot: p14-home-light
- tapOn: "Settings"
- tapOn: "Appearance"
- tapOn: "Dark"
- tapOn: "Back"
- takeScreenshot: p15-home-dark
