appId: com.vedant.velora
---
# Flow A: log in as e2e_alice (seeded with a photo), prove the avatar renders
# in every owner surface, remove the photo, prove the letter fallback returns
# everywhere, then leave the app in saved-dark state for the mismatch probe.
# Asserts are sync gates only; the screenshots carry the visual evidence.
- addMedia:
    - .maestro/media/velora-picker.jpg
- launchApp
- tapOn: "Profile"
- tapOn: "Log in / Sign up"
- tapOn: "Username"
- inputText: "e2e_alice"
- tapOn: "Password"
- inputText: "e2e-alice-pass-1"
- hideKeyboard
- tapOn:
    text: "Log in"
    below: "Password"
- extendedWaitUntil:
    visible:
      text: "E2E Alice"
    timeout: 20000
- takeScreenshot: a1-library-photo
- tapOn: "Home"
- takeScreenshot: a2-home-header-photo
- tapOn: "Profile"
- tapOn: "Settings"
- assertVisible: "Change photo"
- takeScreenshot: a3-settings-photo
- tapOn: "Change photo"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- takeScreenshot: a3b-system-picker
- tapOn:
    id: ".*icon_thumbnail"
- takeScreenshot: a3c-crop
- tapOn: "(?i)crop|done"
- extendedWaitUntil:
    visible: "Change photo"
    timeout: 20000
- takeScreenshot: a3d-picked-photo
- tapOn: "Remove profile photo"
- tapOn: "^Remove$"
- extendedWaitUntil:
    notVisible: "Remove profile photo"
    timeout: 10000
- takeScreenshot: a4-settings-fallback
- tapOn: "Back"
- tapOn: "Home"
- takeScreenshot: a5-home-fallback
- tapOn: "Profile"
- tapOn: "Settings"
- tapOn: "Dark theme"
