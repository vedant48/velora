# Flow A: log in as the seeded user, verify her photo renders in the app
# (authenticated image load), remove it via the UI, verify the initial
# fallback everywhere, then set a saved DARK theme override (device stays
# light) for the theme-mismatch cold-start check.
appId: com.vedant.velora
---
- launchApp
- tapOn: "Profile"
- tapOn: "Log in / Sign up"
- tapOn: "Username"
- inputText: "e2e_alice"
- tapOn: "Password"
- inputText: "e2e-alice-pass-1"
- hideKeyboard
- tapOn: "Log in"
- assertVisible:
    text: "E2E Alice"
    timeout: 20000
- takeScreenshot: a1-library-photo
- tapOn: "Home"
- takeScreenshot: a2-home-header-photo
- tapOn: "Profile"
- tapOn: "Settings"
- assertVisible: "Change photo"
- takeScreenshot: a3-settings-photo
- tapOn: "Remove profile photo"
- tapOn: "Remove"
- assertVisible:
    text: "Change photo"
    timeout: 10000
- takeScreenshot: a4-settings-fallback
- tapOn: "Back"
- tapOn: "Home"
- takeScreenshot: a5-home-fallback
- tapOn: "Profile"
- tapOn: "Settings"
- tapOn: "Dark theme"
