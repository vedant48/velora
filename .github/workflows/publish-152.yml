name: Publish verified v1.5.2 (gated on verify and UI proof)
on:
  push:
    branches: [test/publish-release-152]
    paths: [.ci/publish152]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require BOTH gates green on the exact release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          set -e
          read UI VERIFY < .ci/publish152
          test "$(gh run view "$UI" --json conclusion -q .conclusion)" = success
          test "$(gh run view "$VERIFY" --json conclusion -q .conclusion)" = success
          test "$(gh run view 45454835107 --json conclusion -q .conclusion)" = success
          gh release view v1.5.2 --json isDraft -q .isDraft | grep -q true
      - name: Publish the verified draft as Latest (same bytes), remove unpublished v1.5.1
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          set -e
          gh release edit v1.5.2 --draft=false --latest
          gh release delete v1.5.1 --yes --cleanup-tag || true
          gh release view v1.5.2 --json isDraft,tagName,assets | tee published.json
