name: Verify draft release bytes (v1.5.16)
on:
  push:
    branches: [test/verify-1516]
    paths: [.ci/verify1516]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.5.16
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose failed publish step and list releases
        run: |
          mkdir -p out
          gh release list --repo "$GITHUB_REPOSITORY" --limit 6 > out/releases.txt 2>&1 || true
          gh run view 45649400327 --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -60 > out/failed-1516.log || true
          gh run view 45646659684 --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -30 > out/failed-1515.log || true
      - name: Download draft assets with the workflow token and verify
        continue-on-error: true
        run: |
          mkdir -p out dl
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,assets,targetCommitish > out/release.json || true
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl || echo DOWNLOAD_FAILED > out/download.err
          ls -la dl > out/ls.txt || true
          APK=$(ls dl/*.apk | head -1); SUMS=$(ls dl/*checksums.txt | head -1)
          sha256sum "$APK" > out/apk.sha256
          cp "$SUMS" out/published-checksums.txt
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" > out/apksigner.txt 2>&1 || true
          "$BT/aapt" dump badging "$APK" | head -3 > out/badging.txt || true
          mkdir v14; gh release download v1.5.14 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir v14
          "$BT/apksigner" verify --print-certs v14/*.apk > out/apksigner-v1514.txt 2>&1 || true
          cat out/apk.sha256 out/published-checksums.txt out/badging.txt; grep -i "SHA-256" out/apksigner.txt out/apksigner-v1514.txt
      - name: Remove stray v1.5.15 draft release and tag (draft only, never published)
        run: |
          D=$(gh release view v1.5.15 --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          echo "v1.5.15 isDraft=$D" > out/cleanup.txt
          if [ "$D" = "true" ]; then gh release delete v1.5.15 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >> out/cleanup.txt 2>&1 || true; fi
          gh release view v1.5.15 --repo "$GITHUB_REPOSITORY" >> out/cleanup.txt 2>&1 || echo "v1.5.15 release gone" >> out/cleanup.txt
          git ls-remote --tags origin v1.5.15 >> out/cleanup.txt 2>&1 || true
      - name: Publish evidence
        if: always()
        run: |
          git config user.email ci@velora.local; git config user.name velora-ci
          EV=$(mktemp -d); git worktree add --detach "$EV"
          git -C "$EV" checkout --orphan ci-evidence/verify1516-${{ github.run_id }}
          git -C "$EV" rm -rf . >/dev/null 2>&1 || true
          cp -r out "$EV/" 2>/dev/null || true
          git -C "$EV" add -A; git -C "$EV" commit -m "verify1516 evidence"
          git -C "$EV" push origin HEAD:ci-evidence/verify1516-${{ github.run_id }}
