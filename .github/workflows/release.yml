name: Build & Release Velora APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        default: 'manual-release'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci || npm install

      - name: 🛠️ Ensure Android directory & optimized Gradle properties
        run: |
          if [ ! -f "android/gradlew" ]; then
            npx expo prebuild --platform android --clean
          fi
          # Ensure arm64-v8a target and compressed native packaging
          mkdir -p android
          touch android/gradle.properties
          sed -i '/reactNativeArchitectures=/d' android/gradle.properties || true
          echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties
          echo "expo.useLegacyPackaging=true" >> android/gradle.properties
          echo "android.enableMinifyInReleaseBuilds=true" >> android/gradle.properties
          echo "android.enableShrinkResourcesInReleaseBuilds=true" >> android/gradle.properties

      - name: 🔑 Apply release signing (upload key from repo secrets)
        if: ${{ secrets.VELORA_UPLOAD_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.VELORA_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > /tmp/velora-upload.keystore
          python3 scripts/apply-release-signing.py
        env:
          VELORA_UPLOAD_KEYSTORE_PATH: /tmp/velora-upload.keystore
          VELORA_UPLOAD_STORE_PASSWORD: ${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}
          VELORA_UPLOAD_KEY_ALIAS: ${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}
          VELORA_UPLOAD_KEY_PASSWORD: ${{ secrets.VELORA_UPLOAD_KEY_PASSWORD }}

      - name: 📱 Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          VELORA_UPLOAD_KEYSTORE_PATH: /tmp/velora-upload.keystore
          VELORA_UPLOAD_STORE_PASSWORD: ${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}
          VELORA_UPLOAD_KEY_ALIAS: ${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}
          VELORA_UPLOAD_KEY_PASSWORD: ${{ secrets.VELORA_UPLOAD_KEY_PASSWORD }}

      - name: 🔍 Locate & Prepare APK
        id: prepare_apk
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          APK_FILE="velora-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "./${APK_FILE}"
          ls -lh "./${APK_FILE}"
          echo "apk_file=${APK_FILE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: 🔐 Generate SHA-256 checksum (verified by the in-app updater before install)
        run: |
          CHECKSUM_FILE="velora-${{ steps.prepare_apk.outputs.tag }}-checksums.txt"
          sha256sum "./${{ steps.prepare_apk.outputs.apk_file }}" > "./${CHECKSUM_FILE}"
          cat "./${CHECKSUM_FILE}"
          echo "checksum_file=${CHECKSUM_FILE}" >> $GITHUB_OUTPUT
        id: checksum

      - name: 🔐 Record signing certificate fingerprint (for audit + OAuth registration)
        run: |
          TAG="${{ steps.prepare_apk.outputs.tag }}"
          CERT=$(unzip -p "./velora-${TAG}.apk" META-INF/CERT.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep -E 'SHA1:|SHA256:' || echo 'unavailable')
          echo "$CERT" >> $GITHUB_STEP_SUMMARY
          echo "$CERT"

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag }}
          name: Velora ${{ steps.prepare_apk.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.prepare_apk.outputs.apk_file }}
            ${{ steps.checksum.outputs.checksum_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
