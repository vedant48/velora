name: Build & Release Velora APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        default: 'manual-release'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci || npm install

      - name: 🛠️ Ensure Android directory & optimized Gradle properties
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --clean
          fi
          # Ensure arm64-v8a target and compressed native packaging
          mkdir -p android
          touch android/gradle.properties
          sed -i '/reactNativeArchitectures=/d' android/gradle.properties || true
          echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties
          echo "expo.useLegacyPackaging=true" >> android/gradle.properties
          echo "android.enableMinifyInReleaseBuilds=true" >> android/gradle.properties
          echo "android.enableShrinkResourcesInReleaseBuilds=true" >> android/gradle.properties

      - name: 📱 Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🔍 Locate & Prepare APK
        id: prepare_apk
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          APK_FILE="velora-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "./${APK_FILE}"
          ls -lh "./${APK_FILE}"
          echo "apk_file=${APK_FILE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag }}
          name: Velora ${{ steps.prepare_apk.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: ${{ steps.prepare_apk.outputs.apk_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
