name: Cards endpoint gate 1511 (saved fixed APK, no rebuild)
on:
  push:
    branches: [test/motion-1511-apk]
    paths: [.ci/apk1511]
permissions:
  contents: write
  actions: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - name: Preflight - resolve every referenced seed/script/flow path before building
        run: bash scripts/ci-preflight.sh scripts/cards-1511-apk.sh
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - name: Download saved fixed-build test APK (fix b60d00d, run 45529717813)
        uses: actions/download-artifact@v4
        with:
          name: ui-test-apk
          repository: ${{ github.repository }}
          run-id: 45529717813
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
      - name: Stage APK
        run: |
          mkdir -p candidate && cp dl/app-release.apk candidate/app-release.apk
          ls -la candidate && shasum -a 256 candidate/app-release.apk
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/cards-1511-apk.sh
      - name: Publish evidence
        if: always()
        run: |
          git config user.email ci@velora.local; git config user.name velora-ci
          EV=$(mktemp -d); git worktree add --detach "$EV"
          git -C "$EV" checkout --orphan ci-evidence/apk1511-${{ github.run_id }}
          git -C "$EV" rm -rf . >/dev/null 2>&1 || true
          cp -r proof "$EV/" 2>/dev/null || true
          printf 'run_id=%s\ncommit=%s\n' "${{ github.run_id }}" "$GITHUB_SHA" > "$EV/META.txt"
          git -C "$EV" add -A; git -C "$EV" commit -m "apk1511 evidence"
          git -C "$EV" push origin +HEAD:ci-evidence/apk1511-${{ github.run_id }}
