name: Photo end-to-end verification

# Private, branch-scoped e2e: builds an e2e-only APK pointed at a LOCAL
# wrangler backend (synthetic users/photo, local D1 with all migrations) and
# drives the photo flows on an emulator with Maestro. No production backend,
# no release, no tag. Evidence frames go to a dedicated evidence branch.
# Remove this workflow before the production merge.

on:
  push:
    branches: ['feature/brand-splash-v']
    paths:
      - '.maestro/**'
      - 'scripts/e2e-*'
      - 'scripts/native-theme-mismatch.py'
      - 'server/scripts/e2e-*'
      - '.github/workflows/photo-e2e.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_UPLOAD_KEY: ${{ secrets.VELORA_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci || npm install
      - name: Static checks
        run: |
          npx tsc --noEmit
          node --test tests/*.test.cjs
      - name: Stamp branch candidate version
        run: |
          python3 - <<'PY'
          import json
          with open('app.json') as f:
              d = json.load(f)
          d['expo']['version'] = '1.4.3'
          d['expo']['android']['versionCode'] = 10403
          with open('app.json', 'w') as f:
              json.dump(d, f, indent=2)
              f.write('\n')
          print('stamped version=1.4.3 versionCode=10403 (branch candidate)')
          PY
      - name: Ensure Android directory & gradle properties
        run: |
          if [ ! -f "android/gradlew" ]; then
            npx expo prebuild --platform android --clean
          fi
          mkdir -p android
          touch android/gradle.properties
          printf '\n' >> android/gradle.properties
          sed -i '/reactNativeArchitectures=/d' android/gradle.properties || true
          sed -i '/^expo\.inlineModules\.watchedDirectories=/d' android/gradle.properties || true
          echo "reactNativeArchitectures=arm64-v8a,x86_64" >> android/gradle.properties
          echo "expo.useLegacyPackaging=true" >> android/gradle.properties
          echo "android.enableMinifyInReleaseBuilds=true" >> android/gradle.properties
          echo "android.enableShrinkResourcesInReleaseBuilds=true" >> android/gradle.properties
          echo 'expo.inlineModules.watchedDirectories=[]' >> android/gradle.properties
      - name: Allow cleartext to the local e2e backend (e2e build only, never published)
        run: |
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          grep -c usesCleartextTraffic android/app/src/main/AndroidManifest.xml
      - name: Apply release signing (upload key from repo secrets)
        if: ${{ env.HAS_UPLOAD_KEY == 'true' }}
        run: |
          echo "${{ secrets.VELORA_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > /tmp/velora-upload.keystore
          python3 scripts/apply-release-signing.py
        env:
          VELORA_UPLOAD_KEYSTORE_PATH: /tmp/velora-upload.keystore
          VELORA_UPLOAD_STORE_PASSWORD: ${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}
          VELORA_UPLOAD_KEY_ALIAS: ${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}
          VELORA_UPLOAD_KEY_PASSWORD: ${{ secrets.VELORA_UPLOAD_KEY_PASSWORD }}
      - name: Compute signing cert SHA-256 (feeds updater signature gate)
        run: |
          set -e
          if [ -f /tmp/velora-upload.keystore ]; then
            KS=/tmp/velora-upload.keystore
            ALIAS="${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}"
            PASS="${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}"
          else
            KS=android/app/debug.keystore
            ALIAS=androiddebugkey
            PASS=android
          fi
          CERT_SHA256=$(keytool -list -v -keystore "$KS" -alias "$ALIAS" -storepass "$PASS" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256:[[:space:]]*//')
          test -n "$CERT_SHA256"
          echo "VELORA_CERT_SHA256=${CERT_SHA256}" >> "$GITHUB_ENV"
      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8787
          VELORA_UPLOAD_KEYSTORE_PATH: /tmp/velora-upload.keystore
          VELORA_UPLOAD_STORE_PASSWORD: ${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}
          VELORA_UPLOAD_KEY_ALIAS: ${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}
          VELORA_UPLOAD_KEY_PASSWORD: ${{ secrets.VELORA_UPLOAD_KEY_PASSWORD }}
      - name: Upload private candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: velora-photo-e2e-candidate
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  emulator-e2e:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: velora-photo-e2e-candidate
          path: candidate
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start local backend and seed synthetic data
        run: ./scripts/e2e-backend.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/e2e-emulator.sh
      - name: Backend log tail
        if: always()
        run: tail -n 60 /tmp/wrangler-dev.log || true
      - name: Publish evidence to ci-evidence branch
        if: always()
        run: |
          git config user.email "ci@velora.local"
          git config user.name "velora-ci"
          git fetch origin '+refs/heads/ci-evidence/*:refs/remotes/origin/ci-evidence/*' 2>/dev/null || true
          EV=$(mktemp -d)
          if git rev-parse --verify origin/ci-evidence/photo-e2e >/dev/null 2>&1; then
            git worktree add "$EV" ci-evidence/photo-e2e
          else
            git worktree add --detach "$EV"
            git -C "$EV" checkout --orphan ci-evidence/photo-e2e
            git -C "$EV" rm -rf . >/dev/null 2>&1 || true
          fi
          find "$EV" -maxdepth 1 -mindepth 1 -not -name .git -exec rm -rf {} +
          mkdir -p "$EV/frames"
          cp -r photo-evidence/. "$EV/frames/" 2>/dev/null || true
          printf 'run_id=%s\nsha=%s\ndate=%s\n' "${{ github.run_id }}" "${{ github.sha }}" "$(date -u +%FT%TZ)" > "$EV/frames/META.txt"
          git -C "$EV" add -A
          git -C "$EV" commit -m "Photo e2e evidence for ${{ github.sha }} (run ${{ github.run_id }})" || echo "no changes"
          git -C "$EV" push origin ci-evidence/photo-e2e
          git worktree remove --force "$EV" || true
