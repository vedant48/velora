name: Preview e2e (Explore evidence)

# Branch-scoped visual evidence run: builds the release APK exactly like the
# release pipeline, boots an emulator against a local backend, and captures
# screenshots of the new Explore, skeletons and session restore.
on:
  push:
    branches: [explore-recs-v1.6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci || npm install

      - name: 🧪 Typecheck + unit tests
        run: |
          npx tsc --noEmit
          node --test tests/*.test.cjs

      - name: 🛠️ Ensure Android directory & optimized Gradle properties
        run: |
          mkdir -p android
          touch android/gradle.properties
          printf '\n' >> android/gradle.properties
          sed -i '/reactNativeArchitectures=/d' android/gradle.properties || true
          sed -i '/^expo\.inlineModules\.watchedDirectories=/d' android/gradle.properties || true
          echo "reactNativeArchitectures=arm64-v8a,x86_64" >> android/gradle.properties
          echo "expo.useLegacyPackaging=true" >> android/gradle.properties
          echo "android.enableMinifyInReleaseBuilds=true" >> android/gradle.properties
          echo "android.enableShrinkResourcesInReleaseBuilds=true" >> android/gradle.properties
          echo 'expo.inlineModules.watchedDirectories=[]' >> android/gradle.properties

      - name: 🔑 Apply release signing (upload key from repo secrets)
        run: |
          echo "${{ secrets.VELORA_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > /tmp/velora-upload.keystore
          python3 scripts/apply-release-signing.py
        env:
          VELORA_UPLOAD_KEYSTORE_PATH: /tmp/velora-upload.keystore
          VELORA_UPLOAD_STORE_PASSWORD: ${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}
          VELORA_UPLOAD_KEY_ALIAS: ${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}
          VELORA_UPLOAD_KEY_PASSWORD: ${{ secrets.VELORA_UPLOAD_KEY_PASSWORD }}

      - name: 📱 Build Android Release APK (local e2e backend URL)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8788
          VELORA_UPLOAD_KEYSTORE_PATH: /tmp/velora-upload.keystore
          VELORA_UPLOAD_STORE_PASSWORD: ${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}
          VELORA_UPLOAD_KEY_ALIAS: ${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}
          VELORA_UPLOAD_KEY_PASSWORD: ${{ secrets.VELORA_UPLOAD_KEY_PASSWORD }}

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🗄️ Start local backend (wrangler + local D1, seeded users)
        run: scripts/e2e-backend.sh

      - name: 🎞️ Seed library for Explore evidence
        run: node server/scripts/e2e-seed-library.mjs

      - name: 🐢 Start delay proxy (keeps loading states visible)
        run: nohup node scripts/e2e-delay-proxy.cjs > /tmp/delay-proxy.log 2>&1 &

      - name: 📱 Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: 📦 Download APK
        uses: actions/download-artifact@v4
        with:
          name: preview-apk
          path: candidate

      - name: 📸 Run preview flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb reverse tcp:8788 tcp:8788
            adb install candidate/app-release.apk
            $HOME/.maestro/bin/maestro test --test-output-dir evidence .maestro/preview-explore.yaml

      - name: 🖼️ Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-evidence
          path: |
            evidence
            ~/.maestro/tests
          retention-days: 7
