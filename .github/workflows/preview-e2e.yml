name: Preview e2e (Explore evidence)

# Branch-scoped visual evidence run: builds the release APK exactly like the
# release pipeline, boots an emulator against a local backend, and captures
# screenshots of the new Explore, skeletons and session restore.
# Flow-only changes (.maestro/** only) skip the ~15 min APK build and reuse the
# newest matching preview-apk artifact. Workflow edits DO rebuild: they can
# change the build itself, and the manifest cleartext step below proves it.
on:
  push:
    branches: [explore-recs-v1.6]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # cross-run artifact download when the build is skipped

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: f
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qvE '^\.maestro/|^scripts/e2e-'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci || npm install

      - name: 🧪 Typecheck + unit tests
        run: |
          npx tsc --noEmit
          node --test tests/*.test.cjs

      - name: 🏗️ Expo prebuild (repo tracks only signing config, no gradlew)
        run: |
          if [ ! -f "android/gradlew" ]; then
            npx expo prebuild --platform android --clean
          fi

      - name: 🛠️ Ensure Android directory & optimized Gradle properties
        run: |
          mkdir -p android
          touch android/gradle.properties
          printf '\n' >> android/gradle.properties
          sed -i '/reactNativeArchitectures=/d' android/gradle.properties || true
          sed -i '/^expo\.inlineModules\.watchedDirectories=/d' android/gradle.properties || true
          echo "reactNativeArchitectures=arm64-v8a,x86_64" >> android/gradle.properties
          echo "expo.useLegacyPackaging=true" >> android/gradle.properties
          echo "android.enableMinifyInReleaseBuilds=true" >> android/gradle.properties
          echo "android.enableShrinkResourcesInReleaseBuilds=true" >> android/gradle.properties
          echo 'expo.inlineModules.watchedDirectories=[]' >> android/gradle.properties

      - name: 🔓 Allow cleartext HTTP in the TEST APK only (local e2e backend)
        # The release pipeline never does this; production stays HTTPS-only.
        run: sed -E -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml

      - name: 🔑 Apply release signing (upload key from repo secrets)
        run: |
          echo "${{ secrets.VELORA_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > /tmp/velora-upload.keystore
          python3 scripts/apply-release-signing.py
        env:
          VELORA_UPLOAD_KEYSTORE_PATH: /tmp/velora-upload.keystore
          VELORA_UPLOAD_STORE_PASSWORD: ${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}
          VELORA_UPLOAD_KEY_ALIAS: ${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}
          VELORA_UPLOAD_KEY_PASSWORD: ${{ secrets.VELORA_UPLOAD_KEY_PASSWORD }}

      - name: 📱 Build Android Release APK (local e2e backend URL)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8788
          VELORA_UPLOAD_KEYSTORE_PATH: /tmp/velora-upload.keystore
          VELORA_UPLOAD_STORE_PASSWORD: ${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}
          VELORA_UPLOAD_KEY_ALIAS: ${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}
          VELORA_UPLOAD_KEY_PASSWORD: ${{ secrets.VELORA_UPLOAD_KEY_PASSWORD }}

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  e2e:
    needs: [changes, build]
    # always() is required: without a status function the job is skipped when
    # the reused-APK path intentionally skips the build job.
    if: ${{ always() && needs.changes.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository (full history for artifact tree match)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 22 (wrangler 4 needs >= 22.12)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🗄️ Start local backend (wrangler + local D1, seeded users)
        run: scripts/e2e-backend.sh

      - name: 🎞️ Seed library for Explore evidence
        run: node server/scripts/e2e-seed-library.mjs

      - name: 🐢 Start delay proxy (keeps loading states visible)
        run: nohup node scripts/e2e-delay-proxy.cjs > /tmp/delay-proxy.log 2>&1 &

      - name: 🔥 Warm TMDB proxy (Render free tier sleeps when idle)
        run: |
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null "https://proxy-api-server-f1an.onrender.com/v1/tmdb/3/trending/movie/day"; then exit 0; fi
            sleep 5
          done
          echo "TMDB proxy did not wake in time"
          exit 1

      - name: 📱 Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: 📦 Download APK (built this run)
        if: needs.changes.outputs.app == 'true'
        uses: actions/download-artifact@v4
        with:
          name: preview-apk
          path: candidate

      - name: 📦 Download APK (reuse artifact whose app tree matches HEAD)
        if: needs.changes.outputs.app == 'false'
        run: |
          set -e
          # Newest-first artifacts on THIS branch; accept the first whose run's
          # app tree (everything except .maestro + this workflow) is identical
          # to HEAD. Artifact existence proves its build job succeeded.
          MATCH=""
          # Fingerprint = whole tree except the e2e harness (.maestro,
          # scripts/e2e-*); the workflow file itself is compared, so
          # build-config changes force a fresh build instead of stale reuse.
          for SHA in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=preview-apk&per_page=10" --jq '[.artifacts[] | select(.workflow_run.head_branch == "explore-recs-v1.6") | .workflow_run.head_sha] | unique | .[]'); do
            if git diff --quiet "$SHA" HEAD -- . ':(exclude).maestro' ':(exclude)scripts/e2e-*'; then MATCH="$SHA"; break; fi
          done
          if [ -z "$MATCH" ]; then echo "No preview-apk artifact matches the current app tree; run a full build."; exit 1; fi
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=preview-apk&per_page=10" --jq --arg sha "$MATCH" '[.artifacts[] | select(.workflow_run.head_sha == $sha)] | .[0].workflow_run.id')
          echo "Reusing preview-apk from run $RUN_ID (app tree matches HEAD via $MATCH)"
          gh run download "$RUN_ID" -n preview-apk -D candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚡ Enable KVM (emulator boot times out without it)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 📸 Run preview flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            bash scripts/e2e-run-maestro.sh

      - name: 🖼️ Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-evidence
          path: |
            evidence
            ~/.maestro/tests
          retention-days: 7
