name: UI proof for library tabs at 1404-item scale (local synthetic backend)
on:
  push:
    branches: [test/ui-proof-153]
    paths: [.ci/ui153]
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - name: Prebuild Android and enable cleartext for the local test backend (test build only)
        run: |
          npx expo prebuild --platform android --clean
          mkdir -p android; touch android/gradle.properties; printf '\n' >> android/gradle.properties
          sed -i '/reactNativeArchitectures=/d;/^expo\.inlineModules\.watchedDirectories=/d' android/gradle.properties
          echo "reactNativeArchitectures=x86_64" >> android/gradle.properties
          echo "expo.useLegacyPackaging=true" >> android/gradle.properties
          echo 'expo.inlineModules.watchedDirectories=[]' >> android/gradle.properties
          sed -i 's#<application #<application android:usesCleartextTraffic="true" #' android/app/src/main/AndroidManifest.xml
          grep -c usesCleartextTraffic android/app/src/main/AndroidManifest.xml
      - name: Build test APK (points at 127.0.0.1:8787, never at production)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir candidate && cp android/app/build/outputs/apk/release/app-release.apk candidate/app-release.apk
          grep -c "127.0.0.1:8787" -r android/app/build/generated 2>/dev/null | head -1 || true
      - uses: actions/upload-artifact@v4
        with: { name: ui-test-apk, path: candidate/app-release.apk }
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ui-proof-153.sh
      - name: Publish evidence
        if: always()
        run: |
          git config user.email ci@velora.local; git config user.name velora-ci
          EV=$(mktemp -d); git worktree add --detach "$EV"
          git -C "$EV" checkout --orphan ci-evidence/ui153-${{ github.run_id }}
          git -C "$EV" rm -rf . >/dev/null 2>&1 || true
          cp -r proof "$EV/" 2>/dev/null || true
          printf 'run_id=%s\ncommit=%s\n' "${{ github.run_id }}" "$GITHUB_SHA" > "$EV/META.txt"
          git -C "$EV" add -A; git -C "$EV" commit -m "ui153 evidence"
          git -C "$EV" push origin HEAD:ci-evidence/ui153-${{ github.run_id }}
