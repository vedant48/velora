name: Publish verified v1.5.10 (gated on verify and UI proof)
on:
  push:
    branches: [test/publish-release-1510]
    paths: [.ci/publish1510]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require BOTH gates green on the exact release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          set -e
          read UI VERIFY < .ci/publish1510
          test "$(gh run view "$UI" --json conclusion -q .conclusion)" = success
          test "$(gh run view "$VERIFY" --json conclusion -q .conclusion)" = success
          test "$(gh run view 45518129747 --json conclusion -q .conclusion)" = success
          gh release view v1.5.10 --json isDraft -q .isDraft | grep -q true
      - name: Publish the verified draft as Latest (same bytes); no other release is touched
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          set -e
          gh release edit v1.5.10 --draft=false --latest
          gh release view v1.5.10 --json isDraft,tagName,assets | tee published.json
