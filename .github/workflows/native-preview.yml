name: Verify isolated preview on Android emulator
on:
  push:
    branches: ['build/velora-preview-1']
    paths: ['.github/workflows/native-preview.yml']
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Await preview APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 44942713398 --interval 60 --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: velora-preview
          run-id: 44942713398
          github-token: ${{ github.token }}
          path: preview
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run preview on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install preview/velora-preview.apk
            python3 scripts/native-horizontal-scroll.py
      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p native-evidence
          cp /tmp/emulator.log native-evidence/emulator.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velora-native-evidence
          path: native-evidence/
          retention-days: 1
