name: UI proof profile loading (reuses built APK)
on:
  push:
    branches: [test/ui-proof-1517]
    paths: [.ci/uiprofile]
permissions:
  contents: write
  actions: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-test-apk
          path: candidate
          run-id: 45686817602
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ui-proof-profile.sh
      - name: Publish evidence
        if: always()
        run: |
          git config user.email ci@velora.local; git config user.name velora-ci
          EV=$(mktemp -d); git worktree add --detach "$EV"
          git -C "$EV" checkout --orphan ci-evidence/ui1517-prof-${{ github.run_id }}
          git -C "$EV" rm -rf . >/dev/null 2>&1 || true
          cp -r proof "$EV/" 2>/dev/null || true
          printf 'run_id=%s\ncommit=%s\n' "${{ github.run_id }}" "$GITHUB_SHA" > "$EV/META.txt"
          git -C "$EV" add -A; git -C "$EV" commit -m "ui1517 profile evidence"
          git -C "$EV" push origin HEAD:ci-evidence/ui1517-prof-${{ github.run_id }}
