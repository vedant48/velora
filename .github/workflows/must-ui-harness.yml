name: Must UI harness-only verification

# Private, branch-scoped e2e: builds an e2e-only APK pointed at a LOCAL
# wrangler backend (synthetic users/photo, local D1 with all migrations) and
# drives the photo flows on an emulator with Maestro. No production backend,
# no release, no tag. Evidence frames go to a dedicated evidence branch.
# Remove this workflow before the production merge.

on:
  push:
    branches: [feature/must-home-swipe]
    paths: [.ci/must-ui-harness-once]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: velora-must-ui-candidate
          path: candidate
          run-id: 45245227068
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start local backend and seed synthetic data
        run: |
          ./scripts/e2e-backend.sh
          node server/scripts/e2e-ui-library.mjs
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/e2e-must-ui.sh
      - name: Backend log tail
        if: always()
        run: tail -n 60 /tmp/wrangler-dev.log || true
      - name: Publish evidence to ci-evidence branch
        if: always()
        run: |
          git config user.email "ci@velora.local"
          git config user.name "velora-ci"
          git fetch origin '+refs/heads/ci-evidence/*:refs/remotes/origin/ci-evidence/*' 2>/dev/null || true
          EV=$(mktemp -d)
          if git rev-parse --verify origin/ci-evidence/must-ui >/dev/null 2>&1; then
            git worktree add "$EV" ci-evidence/must-ui
          else
            git worktree add --detach "$EV"
            git -C "$EV" checkout --orphan ci-evidence/must-ui
            git -C "$EV" rm -rf . >/dev/null 2>&1 || true
          fi
          find "$EV" -maxdepth 1 -mindepth 1 -not -name .git -exec rm -rf {} +
          mkdir -p "$EV/frames"
          cp -r photo-evidence/. "$EV/frames/" 2>/dev/null || true
          mkdir -p "$EV/frames/splash"
          cp -r splash-evidence/. "$EV/frames/splash/" 2>/dev/null || true
          printf 'run_id=%s\nsha=%s\ndate=%s\n' "${{ github.run_id }}" "${{ github.sha }}" "$(date -u +%FT%TZ)" > "$EV/frames/META.txt"
          git -C "$EV" add -A
          git -C "$EV" commit -m "Photo e2e evidence for ${{ github.sha }} (run ${{ github.run_id }})" || echo "no changes"
          git -C "$EV" push origin ci-evidence/must-ui
          git worktree remove --force "$EV" || true
