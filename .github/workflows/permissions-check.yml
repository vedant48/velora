name: Permission cleanup native verification
on:
  push:
    branches: [fix/minimal-android-permissions]
    paths: [.ci/permission-once]
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [31]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: velora-permissions-local-test
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45360956953
      - name: Validate isolated reused APK
        run: |
          python3 - <<'PYTEST'
          import zipfile
          b=zipfile.ZipFile('candidate/permission-test.apk').read('assets/index.android.bundle')
          assert b'http://127.0.0.1:8787' in b
          assert b'https://velora-api.vedant-753.workers.dev' not in b
          PYTEST
      - uses: actions/download-artifact@v4
        with:
          name: velora-permissions-production
          path: production
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45356308463
      - name: Download current released APK for in-place upgrade check
        run: |
          curl -fL https://github.com/vedant48/velora/releases/download/v1.4.5/velora-v1.4.5.apk -o production/old.apk
          echo '88fabd45c468d7bf2431876e349d905ecf8d2ada6a91c928e996db8baa971a18  production/old.apk' | sha256sum -c -
          echo 'd651705e132042312cb3fce554450f297fb781782bcca3a2492152ac1ef376a5  production/velora-v1.4.6.apk' | sha256sum -c -
      - name: Install test driver
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start isolated synthetic backend
        run: bash scripts/e2e-backend.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/check-permissions-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permission-evidence-${{ matrix.api }}
          path: permission-evidence
          retention-days: 1
      - name: Preserve inspectable evidence
        if: always()
        run: |
          git config user.name velora-ci
          git config user.email ci@velora.local
          EV=$(mktemp -d)
          git worktree add --detach "$EV"
          git -C "$EV" checkout --orphan ci-evidence/permissions-api31-final-${{ matrix.api }}
          git -C "$EV" rm -rf .
          cp -r permission-evidence/. "$EV/" || true
          printf 'run_id=%s\nsha=%s\napi=%s\n' '${{ github.run_id }}' '${{ github.sha }}' '${{ matrix.api }}' > "$EV/META.txt"
          git -C "$EV" add -A
          git -C "$EV" commit -m 'test: native permission evidence'
          git -C "$EV" push origin HEAD:ci-evidence/permissions-api31-final-${{ matrix.api }}
