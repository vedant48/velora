name: Permission cleanup native verification
on:
  push:
    branches: [fix/minimal-android-permissions]
    paths: [.ci/permission-once]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # secrets context is not allowed in step `if:`; evaluate once here.
      HAS_UPLOAD_KEY: ${{ secrets.VELORA_UPLOAD_KEYSTORE_BASE64 != '' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci || npm install

      - name: Test updater checksum verification
        run: |
          npx tsc --noEmit
          node --test tests/*.test.cjs

      - name: 🏷️ Stamp app version from tag
        id: stamp
        run: |
          TAG="v1.4.6"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3 | cut -d- -f1)
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          python3 - "$VERSION" "$CODE" <<'PY'
          import json, sys
          version, code = sys.argv[1], int(sys.argv[2])
          with open('app.json') as f:
              d = json.load(f)
          d['expo']['version'] = version
          d['expo']['android']['versionCode'] = code
          with open('app.json', 'w') as f:
              json.dump(d, f, indent=2)
              f.write('\n')
          print(f"stamped version={version} versionCode={code}")
          PY
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 🛠️ Ensure Android directory & optimized Gradle properties
        run: |
          if [ ! -f "android/gradlew" ]; then
            npx expo prebuild --platform android --clean
          fi
          # Ensure arm64-v8a target and compressed native packaging.
          # prebuild writes expo.inlineModules.watchedDirectories=[] as the LAST
          # line with NO trailing newline; a plain `echo >>` glues our value onto
          # it and the glued string reaches the inline-modules mirror CLI as one
          # broken JSON arg (root cause of the projectsEvaluated node failure).
          mkdir -p android
          touch android/gradle.properties
          printf '\n' >> android/gradle.properties
          sed -i '/reactNativeArchitectures=/d' android/gradle.properties || true
          sed -i '/^expo\.inlineModules\.watchedDirectories=/d' android/gradle.properties || true
          echo "reactNativeArchitectures=arm64-v8a,x86_64" >> android/gradle.properties
          echo "expo.useLegacyPackaging=true" >> android/gradle.properties
          echo "android.enableMinifyInReleaseBuilds=true" >> android/gradle.properties
          echo "android.enableShrinkResourcesInReleaseBuilds=true" >> android/gradle.properties
          echo 'expo.inlineModules.watchedDirectories=[]' >> android/gradle.properties
          grep -n 'inlineModules\|reactNativeArchitectures' android/gradle.properties

      # Bridge tags (vX.Y.Z-bridge) must stay debug-signed so they install over
      # v1.1.0 as a normal update; upload-key signing is for the final line only.
      - name: 🔑 Apply release signing (upload key from repo secrets)
        if: ${{ env.HAS_UPLOAD_KEY == 'true' && !contains(steps.stamp.outputs.tag, '-bridge') }}
        run: |
          echo "${{ secrets.VELORA_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > /tmp/velora-upload.keystore
          python3 scripts/apply-release-signing.py
        env:
          VELORA_UPLOAD_KEYSTORE_PATH: /tmp/velora-upload.keystore
          VELORA_UPLOAD_STORE_PASSWORD: ${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}
          VELORA_UPLOAD_KEY_ALIAS: ${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}
          VELORA_UPLOAD_KEY_PASSWORD: ${{ secrets.VELORA_UPLOAD_KEY_PASSWORD }}

      - name: 🔍 Verify upload key access (fail fast, before the full build)
        if: ${{ env.HAS_UPLOAD_KEY == 'true' && !contains(steps.stamp.outputs.tag, '-bridge') }}
        run: |
          set -e
          keytool -list -keystore /tmp/velora-upload.keystore -alias "$VELORA_UPLOAD_KEY_ALIAS" -storepass "$VELORA_UPLOAD_STORE_PASSWORD"
          keytool -certreq -keystore /tmp/velora-upload.keystore -alias "$VELORA_UPLOAD_KEY_ALIAS" -storepass "$VELORA_UPLOAD_STORE_PASSWORD" -keypass "$VELORA_UPLOAD_STORE_PASSWORD" -file /tmp/verify.csr
          echo "key-entry access verified (private key decrypts with provided key password)"
        env:
          VELORA_UPLOAD_STORE_PASSWORD: ${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}
          VELORA_UPLOAD_KEY_ALIAS: ${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}
          VELORA_UPLOAD_KEY_PASSWORD: ${{ secrets.VELORA_UPLOAD_KEY_PASSWORD }}

      - name: 🔏 Compute signing cert SHA-256 (feeds updater signature gate)
        id: cert
        run: |
          set -e
          if [ -f /tmp/velora-upload.keystore ]; then
            KS=/tmp/velora-upload.keystore
            ALIAS="${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}"
            PASS="${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}"
          else
            KS=android/app/debug.keystore
            ALIAS=androiddebugkey
            PASS=android
          fi
          CERT_SHA256=$(keytool -list -v -keystore "$KS" -alias "$ALIAS" -storepass "$PASS" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256:[[:space:]]*//')
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::could not compute signing certificate SHA-256"
            exit 1
          fi
          echo "cert_sha256=${CERT_SHA256}"
          echo "VELORA_CERT_SHA256=${CERT_SHA256}" >> "$GITHUB_ENV"
          printf 'SHA256: %s\n' "$CERT_SHA256" > cert-fingerprint.txt

      - name: Pin isolated test backend before compilation
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          p=Path('src/config.ts')
          s=p.read_text().replace("process.env.EXPO_PUBLIC_API_URL ?? 'https://velora-api.vedant-753.workers.dev'", "'http://127.0.0.1:8787'")
          assert "'http://127.0.0.1:8787'" in s
          p.write_text(s)
          PYTEST
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/build .expo
      - name: 📱 Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          VELORA_UPLOAD_KEYSTORE_PATH: /tmp/velora-upload.keystore
          VELORA_UPLOAD_STORE_PASSWORD: ${{ secrets.VELORA_UPLOAD_STORE_PASSWORD }}
          VELORA_UPLOAD_KEY_ALIAS: ${{ secrets.VELORA_UPLOAD_KEY_ALIAS }}
          VELORA_UPLOAD_KEY_PASSWORD: ${{ secrets.VELORA_UPLOAD_KEY_PASSWORD }}

      - name: Verify isolated backend URL before running emulators
        run: |
          python3 - <<'PYTEST'
          import zipfile
          b=zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk').read('assets/index.android.bundle')
          assert b'http://127.0.0.1:8787' in b, 'Local test URL missing: refuse emulator launch'
          assert b'https://velora-api.vedant-753.workers.dev' not in b, 'Production backend present in isolated test APK'
          PYTEST
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/permission-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: velora-permissions-local-test
          path: /tmp/permission-test.apk
          retention-days: 1
  native:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: velora-permissions-local-test
          path: candidate
      - name: Install test driver
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start isolated synthetic backend
        run: bash scripts/e2e-backend.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/check-permissions-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permission-evidence-${{ matrix.api }}
          path: permission-evidence
          retention-days: 1
      - name: Preserve inspectable evidence
        if: always()
        run: |
          git config user.name velora-ci
          git config user.email ci@velora.local
          EV=$(mktemp -d)
          git worktree add --detach "$EV"
          git -C "$EV" checkout --orphan ci-evidence/permissions-fixed-${{ matrix.api }}
          git -C "$EV" rm -rf .
          cp -r permission-evidence/. "$EV/" || true
          printf 'run_id=%s\nsha=%s\napi=%s\n' '${{ github.run_id }}' '${{ github.sha }}' '${{ matrix.api }}' > "$EV/META.txt"
          git -C "$EV" add -A
          git -C "$EV" commit -m 'test: native permission evidence'
          git -C "$EV" push origin HEAD:ci-evidence/permissions-fixed-${{ matrix.api }}
