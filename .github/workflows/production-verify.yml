name: Verify signed production candidate
on:
  push:
    branches: ['build/production-1.4.2']
    paths: ['.github/workflows/production-verify.yml']
permissions:
  contents: read
  actions: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Wait for signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 44952857311 --interval 60 --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: velora-production-candidate
          run-id: 44952857311
          github-token: ${{ github.token }}
          path: candidate
      - name: Get currently published baseline
        run: curl -fL https://github.com/vedant48/velora/releases/download/v1.4.1/velora-v1.4.1.apk -o baseline.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 3072
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell wm size 720x1280
            adb shell wm density 320
            mkdir -p native-evidence
            adb shell getprop ro.product.cpu.abilist > native-evidence/emulator-abis.txt
            adb install baseline.apk > native-evidence/baseline-install.txt 2>&1 || true
            adb install -r candidate/velora-v1.4.2.apk > native-evidence/candidate-install.txt 2>&1
            python3 scripts/native-horizontal-scroll.py
            mv native-evidence swipe-evidence
            python3 scripts/native-production-smoke.py
            mv swipe-evidence native-evidence/swipe
      - name: Preserve host diagnostics
        if: always()
        run: |
          mkdir -p native-evidence
          free -m > native-evidence/host-memory.txt
          sudo dmesg | tail -150 > native-evidence/host-kernel.txt
          ps aux | grep -E 'emulator|qemu' > native-evidence/host-processes.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velora-production-native
          path: |
            native-evidence/
            swipe-evidence/
          retention-days: 1
